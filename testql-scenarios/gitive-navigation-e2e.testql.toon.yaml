  assert_text, #crumb, Tablica Kanban, -
  click, #navigation button[data-view="runner"], -, 400
  assert_url_param, tab, runner, -
  assert_text, #crumb, Konsola Live, -
  click, #navigation button[data-view="overview"], -, 400
  assert_text, #crumb, Przegląd, -
  stop, -, -, -
