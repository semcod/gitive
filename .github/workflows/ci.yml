name: ci

# Example CI. Its runs — green and red alike — are the facts the loop feeds on.
# Point intuition-loop.yml's workflow_run trigger at whatever you actually call this.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
