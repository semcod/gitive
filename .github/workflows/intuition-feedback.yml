name: intuition-feedback

# Immediate reward signal: the moment somebody closes a generated task,
# theta learns from it. Without this, learning only happens on the 6h heartbeat.

on:
  issues:
    types: [closed, reopened]

concurrency:
  group: intuition-feedback
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  learn:
    if: contains(join(github.event.issue.labels.*.name, ','), 'intuition')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Label outcome and take an SGD step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          intuition feedback
          intuition status | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit weights
        run: |
          git config user.name  "intuition[bot]"
          git config user.email "intuition@users.noreply.github.com"
          git add .intuition/
          git diff --cached --quiet || {
            git commit -m "chore(intuition): learn from #${{ github.event.issue.number }} [skip ci]"
            git push
          }
