name: Intuition loop
on:
  workflow_run:
    workflows: [CI, CD, Verify candidate]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only inventory, no LLM calls and no writes
        type: boolean
        default: true
      run_id:
        description: Optional historical workflow run ID to ingest
        type: string
        default: ''
      reset_circuit:
        description: Explicitly reset the consecutive-failures circuit breaker
        type: boolean
        default: false
permissions: {}
concurrency:
  group: intuition-loop-${{ github.repository }}
  cancel-in-progress: false
jobs:
  controller:
    if: >-
      (vars.INTUITION_ENABLED == 'true' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      statuses: write
    steps:
      - name: Checkout trusted control plane only
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install controller dependencies before exposing API secrets
        run: python -m pip install -r requirements.txt
      - name: Observe, propose, create issues and publish an unexecuted candidate
        env:
          GH_TOKEN: ${{ secrets.INTUITION_GH_TOKEN || github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_BASE: https://openrouter.ai/api/v1
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openrouter/z-ai/glm-5.3' }}
          LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT || 'low' }}
          OR_SITE_URL: ${{ github.server_url }}/${{ github.repository }}
          OR_APP_NAME: Intuition-GitHub
          INTUITION_ENABLED: ${{ vars.INTUITION_ENABLED || 'false' }}
          INTUITION_AUTOMERGE: ${{ vars.INTUITION_AUTOMERGE || 'false' }}
          INTUITION_APPLY: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
          INTUITION_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          INTUITION_RESET_CIRCUIT: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_circuit }}
        run: python scripts/run_cycle.py
