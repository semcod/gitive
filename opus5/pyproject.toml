[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intuition"
version = "0.1.0"
description = "Amortized-inference task generator: git + CI logs + LLM as an infinite refactoring loop on GitHub"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Softreck" }]
keywords = ["llm", "git", "github-actions", "refactoring", "task-generation", "litellm"]

dependencies = [
    "numpy>=1.24",
    "litellm>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
intuition = "intuition.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intuition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
