[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitive"
version = "0.1.0"
description = "Gitive CLI, benchmark controller and private workspace tools"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2"]

[project.optional-dependencies]
contracts = ["jsonschema>=4,<5"]

[project.scripts]
gitive = "gitive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gitive"]

[tool.setuptools.package-data]
gitive = ["*.html", "*.js", "*.yaml", "Dockerfile", "Dockerfile.dockerignore", "README.md", "vendor/*", "contracts/*.json", "templates/*/*.json", "templates/*/*.md", "templates/project/*/.gitkeep", "templates/project/project/*.md"]
